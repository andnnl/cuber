name: Desktop Windows / Linux

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            command: desktop:linux
          - os: windows-2022
            command: desktop:win
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install BlueZ scanner build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev pkg-config
      - run: npm install --legacy-peer-deps
      - run: npm run test:desktop
      - name: Test Linux BlueZ scanner
        if: runner.os == 'Linux'
        run: npm run test:linux-scanner
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows Bluetooth scanner
        if: runner.os == 'Windows'
        run: dotnet publish desktop/windows-ble-scanner/CuberBleScanner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o desktop/windows-ble-scanner/publish
      - name: Require Windows scanner in package
        if: runner.os == 'Windows'
        run: if (!(Test-Path desktop/windows-ble-scanner/publish/CuberBleScanner.exe)) { throw 'Windows BLE scanner missing' }
      - run: npm run ${{ matrix.command }} -- --publish never
      - name: Verify scanner embedded in Windows package
        if: runner.os == 'Windows'
        run: if (!(Test-Path desktop-release/win-unpacked/resources/windows-ble-scanner/CuberBleScanner.exe)) { throw 'Built Windows package omitted BLE scanner' }
      - name: Verify scanner embedded in Linux package
        if: runner.os == 'Linux'
        run: test -x desktop-release/linux-unpacked/resources/linux-ble-scanner/CuberBleScanner
      - uses: actions/upload-artifact@v4
        with:
          name: cuber-${{ runner.os }}
          path: |
            desktop-release/*.AppImage
            desktop-release/*.exe
          if-no-files-found: error
