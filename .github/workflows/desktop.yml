name: Desktop Windows / Linux

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            command: desktop:linux
          - os: windows-2022
            command: desktop:win
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps
      - run: npm run test:desktop
      - run: npm run ${{ matrix.command }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: cuber-${{ runner.os }}
          path: |
            desktop-release/*.AppImage
            desktop-release/*.exe
          if-no-files-found: error
