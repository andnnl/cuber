<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>选择蓝牙魔方</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 20px; color: #243044; }
    h2 { margin: 0 0 10px; font-size: 18px; }
    p { color: #667085; line-height: 1.5; }
    #devices { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow: auto; }
    #devices button { text-align: left; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc; cursor: pointer; }
    #devices button:hover { background: #e8f1ff; }
    footer { margin-top: 18px; text-align: right; }
    footer button { padding: 7px 18px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>选择蓝牙魔方</h2>
  <p>请打开魔方并确保未被其他设备占用。若 GAN Gen2 需要 MAC 地址，请在主界面先填写 MAC 再连接。</p>
  <div id="devices" role="list">正在扫描附近的设备…</div>
  <footer><button id="cancel" type="button">取消</button></footer>
  <script src="picker.js"></script>
</body>
</html>
