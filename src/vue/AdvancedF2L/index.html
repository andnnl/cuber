<v-app>
<div class="adv-f2l-root">
  <setting />
  <header class="adv-f2l-header">
    <h1>非标 F2L 公式库</h1>
    <span>54 个案例 · 四种角块位置 · 多解法</span>
    <label class="adv-f2l-z2"><input type="checkbox" aria-label="z2" v-model="z2On" @change="toggleZ2">z2 · 同步翻转全部案例</label>
  </header>
  <div class="adv-f2l-layout">
    <section class="adv-f2l-study" aria-label="公式动画学习">
      <div ref="cubeArea" class="adv-f2l-cube"><viewport ref="viewport"></viewport></div>
      <div class="adv-f2l-details">
        <label class="adv-f2l-hide"><input type="checkbox" aria-label="大魔方隐藏无关块" v-model="hideUnrelated" @change="toggleHideUnrelated">大魔方隐藏无关块（变黑）</label>
        <h2>{{selected.name}} <small>· {{groups.find(item => item.key === selected.subgroup).label}}</small></h2>
        <div class="adv-f2l-directions" aria-label="角块位置">
          <span>角块位置：</span>
          <button v-for="(label, index) in directions" :key="label" type="button" :class="{active: direction === index}"
            @click="selectDirection(index)">{{label}} <small>({{selected.algs[index].length}})</small></button>
        </div>
        <p v-if="error" class="adv-f2l-error">{{error}}</p>
        <template v-if="selection">
          <p class="adv-f2l-source">原公式 {{variant + 1}} / {{selected.algs[direction].length}} · 来源编号 {{selection.altId}}</p>
          <div class="adv-f2l-controls">
            <button type="button" @click="toStart">⏮ 回到起点</button>
            <button type="button" :disabled="playing || step === 0" @click="previous">◀ 上一步</button>
            <button type="button" :disabled="playing || step >= currentMoves.length" @click="next">下一步 ▶</button>
            <button type="button" :disabled="playing || step >= currentMoves.length" @click="play">▶ 播放</button>
            <button type="button" :disabled="!playing || pauseRequested" @click="pause">⏸ 暂停</button>
            <span>{{step}} / {{currentMoves.length}}</span>
          </div>
          <div class="adv-f2l-steps" aria-label="当前公式步骤">
            <span v-for="(move, index) in currentMoves" :key="index" :class="{'done': index < step, 'next': index === step}">{{move}}</span>
          </div>
        </template>
        <h3>该角块位置的公式</h3>
        <div class="adv-f2l-variants" v-if="selected.algs[direction].length">
          <button type="button" v-for="(item, index) in selected.algs[direction]" :key="item.altId"
            :class="{active: index === variant}" @click="selectVariant(index)">
            <b>{{index + 1}}.</b> {{item.alg}}
          </button>
        </div>
        <p v-else>该角块位置在原始资料中暂无公式，请选择其他位置。</p>
      </div>
    </section>
    <section class="adv-f2l-browser" aria-label="非标 F2L 案例">
      <div class="adv-f2l-groups">
        <button type="button" v-for="item in groups" :key="item.key" :class="{active: group === item.key}"
          @click="selectGroup(item.key)">{{item.label}} (18)</button>
      </div>
      <div class="adv-f2l-cases">
        <button type="button" v-for="item in filteredCases" :key="item.id" :class="{active: selected.id === item.id}"
          @click="selectCase(item)">
          <strong>{{item.name}}</strong>
          <span class="adv-f2l-preview" aria-hidden="true">
            <img v-if="previews[previewKey(item)]" class="adv-f2l-preview-image"
              :src="previews[previewKey(item)]" alt="" draggable="false">
          </span>
          <small>四种位置共 {{item.algs.reduce((n, group) => n + group.length, 0)}} 条</small></button>
      </div>
      <small class="adv-f2l-attribution">公式来自 CubeRoot 非标 F2L 快照；本页可离线浏览和播放。</small>
    </section>
  </div>
</div>
</v-app>
