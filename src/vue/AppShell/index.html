<div data-app-shell :style="{'--cube-background': effectiveBackground}" @click.capture="onInternalLink">
  <keep-alive>
    <component :is="currentComponent" :key="currentKey" ref="activeView"></component>
  </keep-alive>
  <div class="global-ble-bar" data-global-ble>
    <button type="button" @click="openConnection" data-global-connect>
      {{snapshot.status === 'connected' ? '🔵 ' + (snapshot.deviceName || '已连接') : snapshot.status === 'connecting' ? '蓝牙连接中…' : 'ᛒ 连接魔方'}}
    </button>
    <template v-if="isCubeView">
      <label><input type="checkbox" :checked="following" @change="setFollowing($event.target.checked)" data-global-follow>跟随实体魔方</label>
      <button type="button" @click="resetVisualCube" data-global-reset>还原画面</button>
    </template>
  </div>
  <div v-if="connectionOpen" class="global-ble-backdrop" @click.self="closeConnection">
    <section class="global-ble-dialog" role="dialog" aria-label="蓝牙魔方连接">
      <button type="button" class="global-ble-close" @click="closeConnection">×</button>
      <h3>蓝牙魔方</h3>
      <p>{{snapshot.status === 'connected' ? (snapshot.deviceName || '已连接') : snapshot.status === 'connecting' ? '正在连接…' : '未连接'}}
        <span v-if="snapshot.battery !== null"> · 电量 {{snapshot.battery}}%</span></p>
      <p v-if="snapshot.error" role="alert">{{snapshot.error}}</p>
      <template v-if="snapshot.status === 'disconnected'">
        <template v-if="!nativeBt">
          <input v-model="manualMac" placeholder="AA:BB:CC:DD:EE:FF" aria-label="MAC 地址" autocomplete="off" @input="macError = ''">
          <button type="button" @click="connect('web')" :disabled="!supportsBluetooth">选择魔方连接</button>
          <button type="button" @click="connect('web', undefined, true)" :disabled="!supportsBluetooth || !manualMac.trim()">用 MAC 连接</button>
          <p v-if="macError" role="alert">{{macError}}</p>
          <p v-if="!supportsBluetooth">当前浏览器不支持 Web Bluetooth；请使用支持该功能的浏览器，并通过 HTTPS 或 localhost 打开页面。</p>
          <small v-else>输入 MAC 后仍需在浏览器设备选择框中授权魔方；MAC 用于连接后的协议解密。</small>
        </template>
        <template v-if="nativeBt">
          <p>{{scanMessage}}</p>
          <button type="button" @click="startScan">重新扫描</button>
          <button v-for="device in scanDevices" :key="device.address" type="button" @click="connect('native', device.address)" :disabled="snapshot.status !== 'disconnected'">
            {{device.name || '蓝牙魔方'}} · {{device.address}}
          </button>
          <p v-if="scanDevices.length === 0">未发现魔方？请重新扫描；网页模式也可在下方填写 MAC 后授权设备。</p>
          <input v-model="manualMac" placeholder="AA:BB:CC:DD:EE:FF" aria-label="MAC 地址" autocomplete="off" @input="macError = ''">
          <button type="button" @click="connect('web', undefined, true)" :disabled="!manualMac.trim()">用 MAC 连接（备用）</button>
          <p v-if="macError" role="alert">{{macError}}</p>
        </template>
        <button type="button" @click="connect('mock')">连接模拟魔方（演示）</button>
      </template>
      <button v-if="snapshot.status === 'connected'" type="button" @click="disconnect">断开连接</button>
    </section>
  </div>
</div>
