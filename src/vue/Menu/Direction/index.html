<v-bottom-sheet v-model="show" overlay-opacity="0" v-resize="resize">
  <v-card flat style="margin: auto; touch-action: none; user-select: none; border-radius: 12px;">
    <v-container fluid :style="{width: Math.min(width, height * 0.42) + 'px', padding: size * 0.25 + 'px'}">
      <div :style="{ 'font-size': size * 0.22 + 'px', color: 'rgba(0,0,0,.6)', 'margin-bottom': size * 0.12 + 'px', 'text-align': 'center' }">
        定向
      </div>
      <div :style="{ position: 'relative' }">
        <select
          v-model="selectedPreScr"
          @change="applyPreScr(selectedPreScr)"
          :style="{
            width: '100%',
            height: size * 0.9 + 'px',
            'font-size': size * 0.28 + 'px',
            'line-height': size * 0.9 + 'px',
            padding: '0 ' + size * 0.35 + 'px 0 ' + size * 0.28 + 'px',
            border: '1px solid rgba(0,0,0,.23)',
            'border-radius': size * 0.14 + 'px',
            background: '#fff',
            color: 'rgba(0,0,0,.87)',
            outline: 'none',
            appearance: 'menulist',
            '-webkit-appearance': 'menulist',
            '-moz-appearance': 'menulist'
          }"
        >
          <option v-for="item in preScrOptions" :key="item.value || 'default'" :value="item.value">
            {{ item.text }}
          </option>
        </select>
      </div>
    </v-container>
  </v-card>
</v-bottom-sheet>
