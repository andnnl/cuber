<div v-resize="resize">
  <v-btn fixed right top fab color="primary" style="user-select: none;"
    :style="{width:size * 0.9+'px', height:size * 0.9+'px', 'margin-right': width / 2 - Math.min(size*4, width/2) + 'px'}"
    @click="menu=!menu">
    <v-icon :size="size * 0.6">menu</v-icon>
  </v-btn>
  <order v-model="items['order'].value" v-on:order="$emit('order');"></order>
  <appear v-model="items['appear'].value"></appear>
  <camera v-model="items['camera'].value"></camera>
  <control v-model="items['control'].value"></control>
  <palette v-if="mode !== 'cfop'" v-model="items['palette'].value"></palette>
  <about v-model="items['about'].value"></about>
  <v-bottom-sheet v-model="menu">
    <v-card text class="setting-menu-card">
      <v-container fluid grid-list-md text-xs-center :style="{width:Math.min(size * 8, width) + 'px'}">
        <v-layout row wrap style="padding-top: 2%; padding-bottom: 5%;">
          <v-flex xs12 class="setting-mode-grid" data-main-mode-grid>
            <v-btn :color="mode == 'playground'?'primary':''" depressed
              class="setting-mode-button"
              @click="tap('playground')" :style="{height: size + 'px'}">
              <v-icon :size="size * 0.8">games</v-icon>
            </v-btn>
            <v-btn :color="mode == 'helper'?'primary':''" depressed
              class="setting-mode-button"
              @click="tap('helper')" :style="{height: size + 'px'}">
              <v-icon :size="size * 0.8">assistant</v-icon>
            </v-btn>
            <v-btn :color="mode == 'algs'?'primary':''" depressed
              class="setting-mode-button"
              @click="tap('algs')" :style="{height: size + 'px'}">
              <v-icon :size="size * 0.8">school</v-icon>
            </v-btn>
            <v-btn :color="mode == 'director'?'primary':''" depressed
              class="setting-mode-button"
              @click="tap('director')" :style="{height: size + 'px'}">
              <v-icon :size="size * 0.8">movie</v-icon>
            </v-btn>
            <v-btn :color="mode == 'f2l'?'primary':''" depressed
              class="setting-mode-button"
              @click="tap('f2l')" :style="{height: size + 'px'}">
              <v-icon :size="size * 0.8">fitness_center</v-icon>
            </v-btn>
            <v-btn :color="mode == 'crossf2l'?'primary':''" depressed
              class="setting-mode-button setting-mode-button--labeled"
              @click="tap('crossf2l')" :style="{height: size + 'px'}">
              <v-icon :size="size * 0.5">track_changes</v-icon>
              <span :style="{'font-size': size * 0.22 + 'px'}">F2L预判</span>
            </v-btn>
            <v-btn :color="mode == 'blecross'?'primary':''" depressed
              class="setting-mode-button setting-mode-button--labeled"
              @click="tap('blecross')" :style="{height: size + 'px'}">
              <v-icon :size="size * 0.5">bluetooth_searching</v-icon>
              <span :style="{'font-size': size * 0.22 + 'px'}">蓝牙十字</span>
            </v-btn>
            <v-btn :color="mode == 'cfop'?'primary':''" depressed
              class="setting-mode-button setting-mode-button--labeled"
              @click="tap('cfop')" :style="{height: size + 'px'}">
              <v-icon :size="size * 0.5">school</v-icon>
              <span :style="{'font-size': size * 0.22 + 'px'}">CFOP学习</span>
            </v-btn>
            <v-btn :color="mode == 'pll6'?'primary':''" depressed
              class="setting-mode-button setting-mode-button--labeled"
              @click="tap('pll6')" :style="{height: size + 'px'}">
              <v-icon :size="size * 0.5">visibility</v-icon>
              <span :style="{'font-size': size * 0.22 + 'px'}">PLL六格</span>
            </v-btn>
            <v-btn :color="mode == 'seamlessop'?'primary':''" depressed
              class="setting-mode-button setting-mode-button--labeled"
              @click="tap('seamlessop')" :style="{height: size + 'px'}">
              <v-icon :size="size * 0.5">remove_red_eye</v-icon>
              <span :style="{'font-size': size * 0.22 + 'px'}">无缝OP</span>
            </v-btn>
          </v-flex>
        </v-layout>
        <v-layout row wrap style="padding-bottom: 2%;">
          <v-flex v-for="(item, i) of items" v-show="item.show && !(mode === 'cfop' && item === items['palette'])" :key="item.label" xs6 class="text-center"
            :style="{'padding-left': size/5 + 'px', 'padding-right': size/5 + 'px', 'padding-bottom': size/5 + 'px'}">
            <v-btn rounded depressed block :disabled="item.disable" @click="tap(item)"
              style="text-transform: none; min-width: 0%; flex: 1;" :height="size * 0.8"
              :style="{'font-size':size / 3 + 'px'}">{{item.label}}
            </v-btn>
          </v-flex>
        </v-layout>
        <div v-if="mode !== 'bleconnect'" style="width:100%; padding:8px 14px; text-align:left; border-top:1px solid #ddd; display:flex; flex-wrap:wrap; align-items:center; gap:8px;">
          <span>3D 背景色 · 全局</span>
          <input data-global-bg type="color" :value="globalColor || '#FFFFFF'" aria-label="全局 3D 背景色" @input="setGlobalBackground($event.target.value)">
          <button data-global-bg-reset type="button" @click="resetGlobalBackground">恢复默认</button>
          <div style="width:100%; display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:4px 2px;">
            <button v-for="item in backgroundPresets" :key="item.value" type="button"
              data-global-bg-preset :data-name="item.name" :data-color="item.value"
              :class="{selected: globalColor === item.value}"
              :title="item.name + ' ' + item.value" :aria-label="item.name + '背景 ' + item.value"
              :style="{backgroundColor: item.value, width:'28px', height:'28px', border:'2px solid #87929a',
                borderRadius:'5px', cursor:'pointer', flex:'0 0 28px',
                outline:globalColor === item.value ? '2px solid #1976D2' : 'none', outlineOffset:'2px'}"
              @click="setGlobalBackground(item.value)"></button>
          </div>
          <span style="width:100%; font-size:12px; color:#667;">当前界面：{{mode}}</span>
          <select data-page-bg-mode :value="pageBackgroundMode" aria-label="当前界面背景模式" @change="setPageBackgroundMode($event.target.value)">
            <option value="global">跟随全局</option><option value="custom">本界面自定义</option>
          </select>
          <input data-page-bg type="color" :disabled="pageBackgroundMode !== 'custom'" :value="pageBackgroundColor" aria-label="当前界面背景色" @input="setPageBackground($event.target.value)">
        </div>
        <v-layout row wrap style="padding-bottom: 5%;">
          <v-flex xs12>
            <v-btn rounded depressed block :color="mode == 'blecross' ? 'primary' : ''" @click="tap('blecross')"
              style="text-transform: none;" :height="size * 0.8"
              :style="{'font-size': size / 3 + 'px'}">
              <v-icon :size="size * 0.4" style="margin-right: 4px;">bluetooth_searching</v-icon>十字训练
            </v-btn>
          </v-flex>
        </v-layout>
      </v-container>
    </v-card>
  </v-bottom-sheet>
</div>
